[project]
name = 'BlockBet'
description = 'Real-time on-chain prediction game on Stacks blockchain'
authors = []
telemetry = true
cache_dir = './.cache'

[contracts.blockbet]
path = 'contracts/blockbet.clar'
clarity_version = 3
epoch = '3.0'

[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
